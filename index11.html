<!DOCTYPE html>
<html>
<head>
   
 <title>Document</title>

  <style>
    .container {
        border: 3px solid black;
        padding: 10px;
        width: 500px;
    }

    .box {
        width: 100px;
        height: 50px;
        color: white;
        text-align: center;
        font-size: 20px;
    }

    .left {
        background-color: blue;
        float: left;
        margin-right: 15px;
    }

    .right {
        background-color: red;
        color: black;
        float: right;
        margin-left: 15px;
    }
    .clear {
        clear: both;
    }
  </style>
</head>
<body>
    <!-- CSS FLOAT -->

    <div class="container">
        <div class="box left">left</div>
        <p>This text wraps around the blue box.</p>
     </div>
     <br>
     <div class="container">
        <div class="box right">right</div>
        <p>This text wraps around the red box.</p>
     </div>
     <br>
     <div class="container">
        <div class="box left"> left</div>
     <div class="box right"> right</div>
     <p class="clear"> this text appears below both boxes.</p>
     </div>
      
   

</body>
</html>
