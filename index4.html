<!DOCTYPE html>
<html>

<head>
    <title>Profile Card</title>
</head>

<body>

    

    <div class="container">

       
        <div class="card">

            

            <div class="left">

                <img src="images/rh.jpg" alt="Profile Photo">

                <h2>Rahul.H</h2>

                <p>Web Developer</p>

            </div>

            <div class="right">

                <h2>INFORMATION</h2>

                <div class="info">

                    <div>
                        <h3>Email</h3>
                        <p>rahulhari11223344@gmail.com</p>
                    </div>

                    <div>
                        <h3>Phone</h3>
                        <p>7356631427</p>
                    </div>

                </div>

                

                <h2>PROJECTS</h2>

                <div class="projects">

                    <div class="project-item">

                        <h3>Recent Projects</h3>

                        <p>Ai integrated smartAttendance System</p>

                    </div>

                    <div class="project-item">

                        <h3>Most Viewed</h3>

                        <p>Web Development</p>

                    </div>

                </div>

            </div>

        </div>

        

        <div class="labels">

            <h1>CSS</h1>

            <h1>USER</h1>

            <h1>PROFILE</h1>

            <h1>CARD</h1>

        </div>

    </div>


    

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f1f1f1;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            justify-content: space-around;
            width: 95%;
            min-height: 550px;
            margin: 20px auto;
            border: 15px solid #eaf1f1;
            padding: 30px;
            align-items: center;
            gap: 30px;
        }

       

        .card {
            width: 80%;
            min-height: 450px;
            display: flex;
            background-color: white;
            box-shadow: 0 2px 10px #ccc;
        }

        

        .left {
            width: 30%;
            background-color: #12c5c1;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        .left img {
            width: 200px;
            height: 230px;
            object-fit: cover;
            border-radius: 60px;
        }

        .left h2 {
            margin-top: 20px;
        }

        .left p {
            margin-top: 15px;
            font-size: 18px;
        }

       

        .right {
            width: 70%;
            padding: 40px 35px;
        }

        .right h2 {
            font-size: 25px;
            letter-spacing: 5px;
            border-bottom: 2px solid #430ca8;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        

        .info {
            display: flex;
            justify-content: flex-start;
            gap: 100px;
            margin-top: 50px;
            margin-bottom: 60px;
        }

        .info h3 {
            margin-bottom: 10px;
            font-size: 20px;
        }

        .info p {
            color: grey;
            font-size: 16px;
        }

       

        .projects {
            display: flex;
            justify-content: flex-start;
            gap: 100px;
            margin-top: 20px;
        }

        .project-item {
            width: 40%;
        }

        .projects h3 {
            margin-bottom: 10px;
            font-size: 20px;
        }

        .projects p {
            color: grey;
            font-size: 16px;
        }

.labels {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .labels h1 {
            background: #12bdb8;
            color: white;
            padding: 12px 25px;
            font-size: 30px;
            font-weight: normal;
        }

      

        @media(max-width: 750px) {

            .container {
                flex-direction: column;
                gap: 30px;
            }

            .card {
                width: 100%;
                flex-direction: column;
            }

            .left, .right {
                width: 100%;
            }

            .projects {
                gap: 20px;
            }

            .info {
                gap: 30px;
            }

            .labels {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .labels h1 {
                font-size: 18px;
            }

        }

    </style>

</body>
</html>
