<!DOCTYPE html>
<html>
<head>
    
    <title>Document</title>
    <link rel="stylesheet" href="style8.css">
</head>
<body>
    <header>
        <h1>REGISTRATION FORM</h1>
    </header>
    <section class="form-container">
    <h2>FILL YOUR DETAILS</h2>
    <form>
        <label>Enter your name:</label>
        <input type="text" placeholder="Enter your name" required><br><br>
        <label>Enter your email:</label>
        <input type="email" placeholder="Enter your email" required><br><br>
        <label>Enter your password:</label>
        <input type="password" placeholder="Enter your password" required><br><br>
        <label>Enter your date of birth:</label>
        <input type="date" required><br><br>
        <label>Enter your gender:</label>
        <select >
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select> <br><br>
        <label> Hobbies:</label>
        <input type="checkbox">
        <label>Reading</label>
        <input type="checkbox">
        <label>Travelling</label>
        <input type="checkbox">
        <label>Sports</label><br><br> 
        <label>Favourite Color:</label>
        <input type="color"><br><br>
        <label>Upload Photo:</label>
        <input type="file"><br><br>
        <label>About you:</label>
        <textarea placeholder="Write about yourself" rows="5"></textarea><br><br>
        <label>Experience:</label>
        <input type="range" min="1" max="10"><br><br>
        <input type="checkbox" required>
        <label>I agree to the terms and conditions</label><br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        
    </form>
</section>

    <source src="audio.mp3" type="audio/mpeg">
</audio>
<video width="500" height="250" controls>
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
</video>
    

</body>
</html>
